<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Página sobre imagens dinâmicas do curso WDD 131 – Fundamentos da Web Dinâmica">
    <meta name="author" content="Jonatha Fernandes">
    <title>WDD 131 – Imagens Responsivas - Jonatha Fernandes</title>
    <link rel="stylesheet" href="estilos/base.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="estilos/imagens-responsivas.css">
</head>

<body>

    <main>
        <div class="principal">
            <picture>
                <source srcset="imagens/principal-grande.webp" media="(min-width: 1000px)">
                <source srcset="imagens/principal-media.webp" media="(min-width: 500px)">
                <img src="imagens/principal-pequena.webp" alt="Nome e localização do templo" width="500" height="250">
            </picture>
        </div>
    </main>

</body>

</html>
