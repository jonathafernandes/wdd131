<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Confirmação do envio da sua avaliação de produto.">
    <meta name="author" content="Jonatha Fernandes">
    <title>Avaliação Enviada - WDD 131</title>
    <link rel="stylesheet" href="estilos/design.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="./scripts/avaliacao.js" defer></script>
</head>

<body>
    <header class="page-header">
        <h1>Avaliação Enviada</h1>
    </header>

    <main>
        <section class="confirmation" aria-labelledby="confirmation-title">
            <p class="confirmation-icon" aria-hidden="true">✓</p>
            <h2 id="confirmation-title">Obrigado pela sua avaliação!</h2>
            <p>Sua contribuição nos ajuda a melhorar nossos produtos.</p>
            <p class="review-count">Total de avaliações concluídas: <span id="contador-avaliacoes"></span></p>
            <a class="submit-button return-link" href="formulario.html">Enviar outra avaliação</a>
        </section>
    </main>

    <footer>
        <p>© 2026 Jonatha Fernandes - Maceió, AL</p>
    </footer>
</body>

</html>
